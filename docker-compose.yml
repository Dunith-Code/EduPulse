services:
  postgres:
    image: postgres:16
    container_name: edupulse-db
    environment:
      POSTGRES_DB: edupulse
      POSTGRES_USER: edupulse
      POSTGRES_PASSWORD: edupulse
    ports:
      - "5433:5432"
    volumes:
      - edupulse-pgdata:/var/lib/postgresql/data

volumes:
  edupulse-pgdata: