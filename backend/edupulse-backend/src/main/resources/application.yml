spring:
  application:
    name: edupulse-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/edupulse
    username: edupulse
    password: edupulse
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

edupulse:
  jwt:
    secret: ${EDUPULSE_JWT_SECRET:dev-only-secret-change-me-in-production-32b!}
    ttl-minutes: 60